<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e13">
<title>Ropa v2 — Demo de fotos</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="src/main.css">
<link rel="stylesheet" href="demo.css">
<link rel="icon" href="data:,">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="toprow">
      <div>
        <div class="brand">Ropa<span>.</span></div>
        <div class="sub" id="subtitle"></div>
      </div>
      <span class="demo-marca">Demo · Solo lectura</span>
    </div>
    <div class="stats" id="stats"></div>
    <div id="tools">
      <div class="buscar" id="searchrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5 16 16"/></svg>
        <input id="search" placeholder="Buscar…" inputmode="search" aria-label="Buscar">
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <main id="main" class="vista"></main>


  <nav id="nav" aria-label="Secciones">
    <button data-v="pedidos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 7.6h14.8l-1.2 12.2H5.8L4.6 7.6z"/><path d="M8.8 7.6V6a3.2 3.2 0 0 1 6.4 0v1.6"/></svg>
      <span class="nav-lbl">Pedidos</span></button>
    <button data-v="inventario">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 8.2 12 3.6 3.4 8.2v7.6l8.6 4.6 8.6-4.6V8.2z"/><path d="M3.4 8.2 12 12.8l8.6-4.6M12 12.8v7.6"/></svg>
      <span class="nav-lbl">Inventario</span></button>
  </nav>

  <div class="hoja" id="hoja"><div class="hoja-in" id="hoja-in" role="dialog" aria-modal="true" aria-label="Hoja"></div></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
